version: '3'

tasks:
  check:
    desc: Ruff, the tests, then build the flake and lint this repository's tags with it
    cmds:
      - task: lint
      - task: test
      - task: tags

  setup:
    desc: Build .venv and link the command onto your PATH
    cmds:
      - uv sync
      - .venv/bin/python -m cli_kit.link .

  test:
    desc: Run the tests
    cmds:
      - uv run pytest --quiet

  lint:
    desc: Lint, and check formatting
    cmds:
      - uv run ruff check
      - uv run ruff format --check

  lint-file:
    desc: Format and fix the Python files given after --
    cmds:
      - |
        for f in {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}; do
          case "$f" in
          *.py|*.pyi) uv run ruff format --quiet "$f" && uv run ruff check --quiet --fix "$f" || exit 1 ;;
          esac
        done

  tags:
    desc: Build the flake, then lint this repository's tags with the command it packages
    cmds:
      # The README's examples and the tests' fixtures are tags by design, some of them broken.
      - |
        out=$(nix --extra-experimental-features 'nix-command flakes' build .#coupled-tags-lint --no-link --print-out-paths)
        "$out/bin/coupled-tags-lint" -x README.md -x tests
