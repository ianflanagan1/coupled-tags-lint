[project]
name = "coupled-tags-lint"
version = "0.1.0"
description = "Checks the COUPLED:<key>: tags in a repository: their form, and that the values they relate agree."
requires-python = ">=3.13"
dependencies = ["cli-kit"]

[project.scripts]
coupled-tags-lint = "coupled_tags_lint.__main__:main"

[tool.uv.sources]
# COUPLED:cli-kit-version: = @/tag = "([^"]+)"/
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", tag = "v0.1.0" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
